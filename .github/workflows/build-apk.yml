name: Build APK

on:
  push:
    branches: [ "claude/mahjong-solitaire-app-oivu2c" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (game logic)
        run: ./gradlew :game:test --stacktrace

      # Release build: not debuggable, so Compose runs at full speed (debug builds are much slower).
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MahjongZen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MahjongZen-apk
          path: MahjongZen.apk

      - name: Publish as pre-release (direct download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: testbuild-${{ github.run_number }}
          name: Mahjong Zen Testbuild ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: Automatisch gebaute Release-APK (mit Debug-Schlüssel signiert). Auf dem Handy herunterladen, antippen und Installation aus unbekannten Quellen erlauben.
          files: MahjongZen.apk
